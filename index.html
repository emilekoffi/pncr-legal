<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNCR — Mentions légales</title>
<style>
:root {
  --bg: #efe9dc; --card: #fdfaf4; --text: #22201c; --muted: #6b655b;
  --rule: #ded5c4; --accent: #2f6b4f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171916; --card: #1f221e; --text: #ece7dd; --muted: #9c968a;
          --rule: #33372f; --accent: #7fc0a0; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline;
  justify-content: space-between; margin-bottom: 2rem; }
.brand { font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  font-size: .8rem; color: var(--muted); text-decoration: none; }
nav { display: flex; gap: .4rem; flex-wrap: wrap; }
nav button { font: inherit; font-size: .85rem; padding: .3rem .7rem; cursor: pointer;
  border: 1px solid var(--rule); background: transparent; color: var(--muted);
  border-radius: 999px; }
nav button[aria-current="true"] { background: var(--accent); border-color: var(--accent);
  color: var(--card); font-weight: 600; }
article { background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
  padding: 2rem 1.75rem; }
article[hidden] { display: none; }
h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .35rem; }
.date { color: var(--muted); font-size: .9rem; margin: 0 0 1.75rem; }
h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; padding-top: 1.25rem;
  border-top: 1px solid var(--rule); }
h2:first-of-type { border-top: 0; padding-top: 0; }
p { margin: 0 0 .9rem; }
ul { margin: 0 0 .9rem; padding-left: 1.15rem; }
li { margin-bottom: .3rem; }
a { color: var(--accent); }
footer { margin-top: 2rem; color: var(--muted); font-size: .85rem; text-align: center; }

.links { list-style: none; padding: 0; margin: 0; }
.links li { margin-bottom: .75rem; }
.links a { font-size: 1.05rem; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
<header><span class="brand">PNCR</span></header>
<article data-lang="fr">
<h1>PNCR — Parcs Naturels Costa Rica</h1>
<p class="date">Documents légaux de l'application mobile.</p>
<ul class="links">
  <li><a href="privacy.html">Politique de confidentialité / Privacy Policy</a></li>
  <li><a href="terms.html">Conditions d'utilisation / Terms of Use</a></li>
</ul>
<p>Contact : <a href="mailto:cr.pncr@outlook.com">cr.pncr@outlook.com</a></p>
</article>
<footer>PNCR — Parcs Naturels Costa Rica</footer>
</div>
</body>
</html>
